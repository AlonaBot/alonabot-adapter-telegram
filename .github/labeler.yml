# 按仓库真实路径分配区域标签；标签由维护者统一建立。
"area: docs":
  - changed-files:
      - any-glob-to-any-file: ["*.md", "docs/**", "changelog/**"]
"area: tests":
  - changed-files:
      - any-glob-to-any-file: ["**/*_test.go", "telegramtest/**"]
"area: github-actions":
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
"area: telegram":
  - changed-files:
      - any-glob-to-any-file: ["telegram.go", "internal/telegram/**", "action/**", "event/**", "perm/**", "cmd/**", "adapter_config_schema.json", "plugin.yaml", "go.mod", "go.sum"]
